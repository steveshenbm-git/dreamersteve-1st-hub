interface:
  display_name: "外贸全流程控制器"
  short_description: "按真实产物、检察预检与分层证据控制外贸流程"
  default_prompt: "使用 $foreign-trade-workflow-director 审计当前公司或新公司的完整外贸流程。先读取当前会话记忆、可用的公司或框架治理登记及相关任务台账，按真实产物找出最早未完成阶段；只输出一个处置和一项下一动作。专业事实仍由专业技能判断，源码、测试、发布、安装、前向验证和真实效果不得跨层推断。新 RC2 默认 content_first，完整内容门也不能解除 RESEARCH_ONLY_BLOCKED 或替代独立下游授权。"
